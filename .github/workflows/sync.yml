# 讀 Google Drive「植物照片」-> 更新 data.json(與介質照片)-> commit -> 對齊 Supabase。
# 需要 repo Secrets:GOOGLE_API_KEY、SUPABASE_URL、SUPABASE_SERVICE_KEY
# 手動執行:Actions -> Drive sync -> Run workflow(預設「只預演」,不會改任何東西)
name: Drive sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只預演(不寫入、不 commit)'
        type: boolean
        default: true
      force:
        description: '略過「一次變動過多」的安全中止'
        type: boolean
        default: false
  # 每日排程:預演確認沒問題後再打開(台灣時間 03:10)
  # schedule:
  #   - cron: '10 19 * * *'

permissions:
  contents: write

concurrency:
  group: swf-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install requests

      - name: Sync from Drive
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python tools/sync_swf.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Check files
        run: |
          python -c "import json; json.load(open('data.json', encoding='utf-8'))"
          node --check knowledge.js

      - name: Commit changes
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data.json knowledge.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "swf-sync-bot"
            git config user.email "swf-sync-bot@users.noreply.github.com"
            git add data.json knowledge.js
            git commit -m "Auto sync from Drive"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import to Supabase
        if: ${{ !inputs.dry_run && steps.commit.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python tools/import_to_supabase.py
